[project]
name = "dimergio"
version = "0.1.1"
description = "Smart file redistribution for mergerfs pools based on read observation"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
    "readchar>=4.0",
]

[project.scripts]
dimergio = "dimergio.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
dimergio = [
    "bin/dimergio-mmap",
    "bpf/mmap_tracer.c",
    "bpf/mmap_tracer.bpf.c",
    "bpf/Makefile",
]

[tool.pyright]
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
